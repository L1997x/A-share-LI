name: Update A-share pool

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Trigger source (manual or cloudflare)"
        required: false
        default: "manual"
      target_schedule:
        description: "Original UTC cron expression for phase labeling"
        required: false
        default: ""
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "docs/**"
      - "requirements.txt"
      - ".github/workflows/update-data.yml"
  schedule:
    # GitHub cron uses UTC. Primary jobs start about seven minutes before the
    # requested Beijing-time snapshot; backups use uncommon minutes to avoid
    # top-of-hour congestion.
    - cron: "53 1 * * 1-5"  # 09:53 -> 10:00 target
    - cron: "11 2 * * 1-5"  # 10:11 backup
    - cron: "13 3 * * 1-5"  # 11:13 -> 11:20 target
    - cron: "31 3 * * 1-5"  # 11:31 backup
    - cron: "23 5 * * 1-5"  # 13:23 -> 13:30 target
    - cron: "41 5 * * 1-5"  # 13:41 backup
    - cron: "23 6 * * 1-5"  # 14:23 -> 14:30 target
    - cron: "41 6 * * 1-5"  # 14:41 backup
    - cron: "53 11 * * 1-5" # 19:53 -> 20:00 target
    - cron: "11 12 * * 1-5" # 20:11 backup
    # Low-cost watchdog. It exits before installing dependencies when the
    # latest due target is already covered.
    - cron: "7,22,37,52 1-12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

# Queue refreshes instead of canceling a data build when delayed cron events
# arrive close together. The guard below removes obsolete duplicates cheaply.
concurrency:
  group: "a-share-refresh"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy_required: ${{ steps.refresh_mode.outputs.deploy_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Validate refresh guard
        run: python3 -m unittest discover -s tests -v

      - name: Decide refresh mode
        id: refresh_mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python3 scripts/refresh_guard.py \
              --event schedule \
              --schedule "${{ github.event.schedule }}" \
              --latest data/latest.json \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.trigger_source }}" == "cloudflare" ]]; then
            python3 scripts/refresh_guard.py \
              --event schedule \
              --schedule "${{ inputs.target_schedule }}" \
              --latest data/latest.json \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_generator=true" >> "$GITHUB_OUTPUT"
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo "effective_schedule=" >> "$GITHUB_OUTPUT"
            echo "decision=Manual run requested." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"
          echo "$changed_files"
          if echo "$changed_files" | grep -Eq '^(scripts/generate_pool\.py|requirements\.txt)$'; then
            echo "run_generator=true" >> "$GITHUB_OUTPUT"
            echo "decision=Generator-affecting files changed." >> "$GITHUB_OUTPUT"
          else
            echo "run_generator=false" >> "$GITHUB_OUTPUT"
            echo "decision=Static or workflow-only push." >> "$GITHUB_OUTPUT"
          fi
          echo "deploy_required=true" >> "$GITHUB_OUTPUT"
          echo "effective_schedule=" >> "$GITHUB_OUTPUT"

      - name: Show refresh decision
        run: echo "${{ steps.refresh_mode.outputs.decision }}"

      - name: Set up Python
        if: steps.refresh_mode.outputs.run_generator == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.refresh_mode.outputs.run_generator == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate latest pool
        if: steps.refresh_mode.outputs.run_generator == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ steps.refresh_mode.outputs.effective_schedule }}
          GITHUB_TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: python scripts/generate_pool.py

      - name: Commit updated data
        if: steps.refresh_mode.outputs.run_generator == 'true'
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update A-share pool data"
            git pull --rebase origin main
            git push
          else
            echo "No data changes."
          fi

  deploy:
    needs: update
    if: needs.update.outputs.deploy_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy updated static app
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploying static app
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Fail if Pages deploy failed twice
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome != 'success'
        run: exit 1
